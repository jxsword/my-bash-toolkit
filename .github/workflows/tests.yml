name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ubuntu-26-04:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: 安装工具链
        run: |
          sudo apt-get update
          if ! sudo apt-get install -y bats shfmt shellcheck pre-commit; then
            sudo apt-get install -y bats shfmt shellcheck
            python3 -m pip install --user --break-system-packages pre-commit
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: bash 环境预检（.bash-version 判定）
        run: |
          id
          scripts/lib/env.sh
      - name: pre-commit 全量检查
        # bats-changed 钩子在 --all-files 下会回退全量，与后面的 make test 重复；
        # CI 的全量兜底由 make test 承担，这里跳过该钩子
        run: SKIP=bats-changed pre-commit run --all-files
      - name: 规范实证用例
        run: make check-rules
      - name: 单元测试
        run: make test
