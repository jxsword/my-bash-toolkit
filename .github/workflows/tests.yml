name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ubuntu-26-04:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: 安装工具链
        run: |
          sudo apt-get update
          if ! sudo apt-get install -y bats shfmt shellcheck pre-commit; then
            sudo apt-get install -y bats shfmt shellcheck
            python3 -m pip install --user --break-system-packages pre-commit
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: bash 环境预检（.bash-version 判定）
        run: |
          id
          scripts/lib/env.sh
      - name: pre-commit 全量检查
        run: pre-commit run --all-files
      - name: 规范实证用例
        run: make check-rules
      - name: 单元测试
        run: make test
